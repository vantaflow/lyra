<style>
body{margin:0;font-family:Manrope,-apple-system,"Segoe UI",system-ui,sans-serif;color:#1C1C2E}
a{color:#4A48C4}a:hover{color:#2F2D8A}
.star{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:#C9C9EA;font:13px/1 Manrope,-apple-system,"Segoe UI",system-ui,sans-serif;width:100%;text-align:left;cursor:pointer;box-sizing:border-box;position:relative}

.star.active{background:#262650;color:#fff}
.star .dot{width:8px;height:8px;border-radius:50%;background:#A8A8D8;flex:none}
.star.active .dot{background:#F4C56A;box-shadow:0 0 0 3px rgba(244,197,106,.22),0 0 14px rgba(244,197,106,.7)}
.star.dim{color:#8686B4}.star.dim .dot{background:#4E4E7A}
.star .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.branch{margin-left:12px;padding-left:12px;border-left:1px solid #3B3B70;display:flex;flex-direction:column}
.branch .star::before{content:"";position:absolute;left:-12px;top:50%;width:10px;height:1px;background:#3B3B70}
.grp{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7F7FB0;padding:12px 8px 4px;font-weight:600}

.pin{width:28px;height:28px;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;font:700 11px Manrope,sans-serif;color:#fff;cursor:pointer}
.cb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#4A4A66;cursor:pointer;padding:0}
.cb:hover{background:#EEEEF6;color:#1C1C2E}
.cb[disabled]{color:#B8B8CC;cursor:default}
kbd{font:600 10.5px/1 Manrope,sans-serif;background:#2E2E5A;color:#B3B3DA;padding:4px 6px;border-radius:5px;letter-spacing:.02em}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;border:0;background:transparent;color:#C9C9EA;font:12.5px Manrope,sans-serif;cursor:pointer;padding:8px 4px;border-radius:12px}
.site:hover{background:#1B1B3A;color:#fff}
.site i{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:15px;color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid #2E2E5C;border-radius:17px;background:#16163A;color:#D9D9F0;font:500 13px Manrope,sans-serif;cursor:pointer}
.chip:hover{background:#20204A;color:#fff}
</style>

<div style="width: 100%; min-height: 100vh; display: flex; background: #E9E9F3; font-size: 14px; line-height: 1.45">

        <span style="width: 12px; height: 12px; border-radius: 50%; background: #2E2E55"></span>

      <button class="sb" type="button" aria-label="Replier le ciel" style="width: 28px; height: 28px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>

      <div class="branch">
        <button class="star dim" type="button"><span class="dot" aria-hidden="true"></span><span class="t">Exécution CI n° 1842</span></button>

    <div style="display: flex; align-items: center; gap: 2px; padding-top: 8px; border-top: 1px solid #26264A">
      <button type="button" aria-label="Boucliers actifs" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 8px; border: 0; border-radius: 9px; background: transparent; color: #5FD3B3; font: 600 12.5px Manrope, sans-serif; cursor: pointer">

      </button>
      <span style="flex: 1"></span>

      <button class="sb" type="button" aria-label="Téléchargements"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg></button>

    </div>

            <button class="site" type="button"><i style="background: #1E7F6C">M</i>Messagerie</button>

            <button class="site" type="button"><i style="background: #D97A2B">K</i>Kagi</button>
            <button class="site" type="button"><i style="background: #2D5BD1">W</i>Wikipédia</button>
            <button class="site" type="button"><i style="background: #B5452F">Y</i>YouTube</button>
